name: hello_plugin
version: 1
description: hello_plugin

roles:
  run:
    - user
    - admin

schema:
  type: object
  title: Config
  properties:
    webhook_url:
      type: string
      title: Webhook URL
      default: demohottab@hottab.net
      ui:options:
        size: 6

    webhook_api_key:
      type: string
      title: Webhook API Key
      default: '12345678'
      ui:widget: password
      ui:options:
        size: 6

    env:
      type: string
      title: Env
      enum:
        - staging
        - production
        - uat
        - uat_testing_multiple_models
      default: staging

    model_type:
      type: string
      title: Model Type
      default: ''
      ui:field: Dynamic
      code: |
        export default function ({
          onChange,
          formData,
          fieldPathId,
          React: { useState },
          Mui: { Box, Button, TextField, Typography }
        }) {
          const [input, setInput] = useState(formData);
          
          const handleRun = async () => {
            onChange(input, fieldPathId.path);
          };

          return (
            <Box display="flex" flexDirection="column" gap={2}>
              <Typography variant="subtitle1">
                Compiled react component
              </Typography>

              <TextField
                multiline
                minRows={4}
                maxRows={10}
                value={input}
                onBlur={() => {
                  onChange(input, fieldPathId.path);
                }}
                onChange={(e) => setInput(e.target.value)}
                fullWidth
              />

              <Button variant="contained" onClick={handleRun}>
                Compile
              </Button>
            </Box>
          );
        }

      model:binding:
        - model_type

      model:expr:
        list: '{{ list_trade_models(env, webhook_url, webhook_api_key) | tojson }}'
        create: '{{ create_trade_model(payload, webhook_url, webhook_api_key, env) | tojson }}'
        delete: '{{ deactivate_trade_model(key, webhook_url, webhook_api_key, env) | tojson }}'

      model:deps:
        - webhook_url
        - webhook_api_key
        - env

      ui:options:
        size: 12
        createSchema:
          type: object
          properties:
            key:
              type: string
              title: Key
            name:
              type: string
              title: Name
            description:
              type: string
              title: Description
            source:
              type: string
              title: Source
            detail:
              type: string
              title: Detail (JSON)
          required:
            - key
            - name

  required: []

env:
  greeting: Hello
